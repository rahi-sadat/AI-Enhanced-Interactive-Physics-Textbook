<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Physics Simulation</title>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>Interactive Physics Simulation</h1>
        <p>JSON-driven Matter.js simulation</p>
      </header>

      <main>
        <div id="diagram-stage" class="diagram-stage">
          <img id="diagram-image" class="diagram-image" alt="Physics textbook diagram" />
          <div id="simulation-container" class="simulation-overlay"></div>
        </div>

        <section class="controls">
          <div class="button-group">
            <button id="play-button">Play</button>
            <button id="pause-button">Pause</button>
            <button id="reset-button">Reset</button>
            <label class="toggle-label"><input type="checkbox" id="toggle-colliders" /> Show Colliders (Debug)</label>
          </div>

          <div class="control">
            <label for="gravity-slider">Gravity strength: <span id="gravity-value">1</span></label>
            <input id="gravity-slider" type="range" min="0" max="2" step="0.1" value="1" />
          </div>

          <div class="control">
            <label for="speed-slider">Simulation speed: <span id="speed-value">1x</span></label>
            <input id="speed-slider" type="range" min="0.1" max="2" step="0.1" value="1" />
          </div>

          <div class="control">
            <label for="target-object-select">Target object: </label>
            <select id="target-object-select"></select>
          </div>

          <div class="control">
            <label for="velocity-slider">Initial X velocity: <span id="velocity-value">0 m/s</span></label>
            <input id="velocity-slider" type="range" min="-10" max="10" step="1" value="0" />
            <button id="apply-velocity-button">Apply Velocity</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
